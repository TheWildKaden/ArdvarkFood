name: Update generated architecture

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "19 7 * * 1"

permissions:
  contents: write

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source parsers and Mermaid renderer
        run: npm ci
      - name: Install Mermaid browser
        run: npx puppeteer browsers install chrome
      - name: Generate and validate architecture docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_architecture.py
      - name: Commit generated assets only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture/
          if git diff --cached --quiet; then
            echo "Generated architecture is already current."
          else
            git commit -m "docs: update generated architecture [skip ci]"
            git push
          fi
