<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101410">
    <title>AI Buddy</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101410;
        color: #f0f3ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --muted: #9da69a;
        --line: #29312a;
        --accent: #b8ef86;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, textarea { font: inherit; }
      .shell { display: flex; flex-direction: column; min-height: 100vh; }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(100%, 900px);
        margin: 0 auto;
        padding: 22px 24px;
        border-bottom: 1px solid var(--line);
      }
      .mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 14px;
        background: #24311f;
        color: var(--accent);
        font-size: 22px;
      }
      .brand { margin: 0; font-size: 16px; font-weight: 650; }
      .tagline { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        width: min(100%, 900px);
        margin: 0 auto;
        padding: 36px 24px 24px;
      }
      #welcome { margin: auto auto 24px; text-align: center; }
      #welcome .mark { width: 58px; height: 58px; margin: 0 auto 18px; font-size: 30px; }
      #welcome h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 36px); letter-spacing: -1px; }
      #welcome p { margin: 0; color: var(--muted); }
      #messages { display: grid; gap: 20px; margin: auto 0 20px; }
      .message { display: flex; gap: 12px; align-items: flex-start; }
      .message.user { flex-direction: row-reverse; }
      .avatar {
        display: grid;
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--accent);
        font-size: 15px;
      }
      .user .avatar { border-color: #394432; color: #d7e8ce; }
      .bubble {
        max-width: min(78%, 680px);
        padding: 11px 15px;
        border: 1px solid var(--line);
        border-radius: 4px 16px 16px;
        background: #171d17;
        line-height: 1.65;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .user .bubble { border-color: #394432; border-radius: 16px 4px 16px 16px; background: #202a1e; }
      #status { min-height: 22px; margin: 0 0 8px 44px; color: var(--muted); font-size: 13px; }
      .composer {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        padding: 10px;
        border: 1px solid #3a4439;
        border-radius: 18px;
        background: #171d17;
        box-shadow: 0 16px 45px #0003;
      }
      textarea {
        flex: 1;
        min-height: 44px;
        max-height: 180px;
        resize: vertical;
        padding: 12px 10px;
        border: 0;
        outline: 0;
        background: transparent;
        color: inherit;
        line-height: 1.5;
      }
      textarea::placeholder { color: #818b7e; }
      button {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border: 0;
        border-radius: 13px;
        background: var(--accent);
        color: #15200f;
        cursor: pointer;
        font-size: 20px;
        font-weight: 700;
      }
      button:disabled { cursor: wait; opacity: .55; }
      .hint { margin: 10px 0 0; color: #818b7e; font-size: 11px; text-align: center; }
      @media (max-width: 560px) {
        header { padding: 16px; }
        main { padding: 26px 16px 18px; }
        .bubble { max-width: 88%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="mark" aria-hidden="true">✦</div>
        <div>
          <p class="brand">AI Buddy</p>
          <p class="tagline">Your general-purpose AI, running from this Codespace</p>
        </div>
      </header>
      <main>
        <section id="welcome" aria-label="Welcome">
          <div class="mark" aria-hidden="true">✦</div>
          <h1>Hey, I'm Buddy.</h1>
          <p>Ask me anything. Let's figure it out together.</p>
        </section>
        <section id="messages" aria-live="polite" aria-label="Conversation"></section>
        <p id="status" role="status"></p>
        <form id="chat-form" class="composer">
          <textarea id="prompt" aria-label="Message Buddy" placeholder="Message Buddy..." maxlength="8000" required></textarea>
          <button id="send" type="submit" aria-label="Send message">↑</button>
        </form>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </main>
    </div>
    <script>
      const history = [];
      const form = document.querySelector("#chat-form");
      const promptInput = document.querySelector("#prompt");
      const messages = document.querySelector("#messages");
      const welcome = document.querySelector("#welcome");
      const status = document.querySelector("#status");
      const send = document.querySelector("#send");

      function addMessage(role, content) {
        const row = document.createElement("article");
        row.className = `message ${role}`;
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = role === "assistant" ? "✦" : "Y";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;
        row.append(avatar, bubble);
        messages.append(row);
        row.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      promptInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = promptInput.value.trim();
        if (!content || send.disabled) return;

        if (history.length >= 32) history.splice(0, 2);
        welcome.hidden = true;
        addMessage("user", content);
        history.push({ role: "user", content });
        promptInput.value = "";
        send.disabled = true;
        status.textContent = "Buddy is thinking...";

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "The AI request failed.");
          history.push({ role: "assistant", content: result.reply });
          addMessage("assistant", result.reply);
          status.textContent = "";
        } catch (error) {
          history.pop();
          status.textContent = error.message || "Could not reach AI Buddy. Try again.";
        } finally {
          send.disabled = false;
          promptInput.focus();
        }
      });
    </script>
  </body>
</html>
